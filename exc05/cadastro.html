</head>

    <main>
        <h1><h1>Barber <span>Studio</span></h1></h1>
        <form action="" class="formulario">
            <label for="texto" id="nome">Nome do Cliente</label>
            <input type="text" name="texto" id="nome" placeholder="Nome Completo" required>
            <div id="dados-contato">
                <p>
                    <label for="cpf" id="cpf">CPF</label>
                    <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" required>
                </p>
                <p>
                    <label for="telefone" id="telefone" >Telefone de Contato</label>
                    <input type="tel" name="telefone" id="telefone" placeholder="(xx) xxxx-xxxx" required>
                </p>
            </div>
            <label for="email" id="email">Email</label>
            <input type="email" name="email" id="email" placeholder="email@gmail.com" required>
            <label for="endereco" id="endereco">Endereço Completo</label>
            <input type="text" name="endereco" id="endereco" placeholder="Rua, número e bairro" required>
            <div class="origem-cliente">
                <p>Como soube da Loja?</p>
                <div class="lista">
                    <p>
                        <input type="radio" name="origem" id="amigo">
                        <label for="amigo">Amigo</label>
                    </p>
                    <p>
                        <input type="radio" name="origem" id="redes-sociais">
                        <label for="redes-sociais">Redes Sociais</label>
                    </p>
                    <p>
                        <input type="radio" name="origem" id="outros">
                        <label for="outros">Outros</label>
                    </p>
                </div>
            </div>
            <div id="btn">
                <input type="submit" value="Salvar Alterações" class="btn-cor" id="salvar">
                <input type="reset" value="Cancelar" class="btn-cor" id="cancelar">
            </div>

        </form>
    </main>
</body>
</html>
